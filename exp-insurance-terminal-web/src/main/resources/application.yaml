server:
  port: ${SERVER_PORT:8121}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  application:
    name: exp-insurance-terminal
  threads:
    virtual:
      enabled: true

api-configuration:
  domain-platform:
    security-center:
      base-path: ${SECURITY_CENTER_URL:http://localhost:8085}

firefly:
  cache:
    enabled: true
    redis:
      enabled: false
    default-cache-type: POSTGRES
    postgres:
      enabled: true
      host: ${CACHE_DB_HOST:localhost}
      port: ${CACHE_DB_PORT:5432}
      database: ${CACHE_DB_NAME:}
      username: ${CACHE_DB_USERNAME:}
      password: ${CACHE_DB_PASSWORD:}
      ssl-mode: ${CACHE_DB_SSL_MODE:verify-full}
      schema: ${CACHE_DB_SCHEMA:firefly_insurance_terminal_cache}
      cache-table: cache_entries
      auto-create-schema: false
      min-pool-size: 1
      max-pool-size: 2
      connect-timeout: 5s
      acquire-timeout: 5s
      initialization-timeout: 15s
      shutdown-timeout: 5s
  security:
    resource-server:
      strict-policy: true
  terminal:
    adapter: ${FIREFLY_TERMINAL_ADAPTER:sandbox}
    configuration-base-url: ${CONFIG_MGMT_URL:http://localhost:8088}
    master-data-base-url: ${MASTER_DATA_URL:http://localhost:8089}
    distributor-base-url: ${DISTRIBUTOR_MGMT_URL:http://localhost:8070}
    domains:
      policies: ${INSURANCE_POLICIES_URL:http://localhost:8071}
      claims: ${INSURANCE_CLAIMS_URL:http://localhost:8072}
      submissions: ${INSURANCE_UNDERWRITING_URL:http://localhost:8073}
